name: frontend CI
on:
  push:
    branches: [main, dev]

  pull_request:
    branches: [main, dev]

jobs:
  lint:
  name: Lint Code Base
  runs-on: ubuntu-latest

  permissions:
    contents: read
    statuses: write

  steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Lint Code Base
      uses: github/super-linter@v4
  env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    VALIDATE_ALL_CODEBASE: false
    IGNORE_GENERATED_FILES: true
    IGNORE_GITIGNORED_FILES: true
